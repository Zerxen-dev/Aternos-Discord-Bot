name: 🐛 Bug Report
description: Create a report to help us fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please make sure you do NOT post your Discord bot token or Aternos credentials.
  - type: input
    id: version
    attributes:
      label: Bot Version / Commit SHA
      description: What version of the bot are you running? (e.g. v2.0.0 or git commit)
      placeholder: v2.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment Environment
      options:
        - Docker / Docker Compose
        - Linux VPS (Ubuntu/Debian)
        - Android (Termux)
        - Windows / macOS native
        - Pterodactyl Panel
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run slash command '/...'
        2. Observe error embed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant console logs here (sanitize tokens/passwords!).
      render: shell
