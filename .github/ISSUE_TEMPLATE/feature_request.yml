name: ✨ Feature Request
description: Suggest an idea or enhancement for Aternos Discord Bot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Tell us what you would like to see added or improved.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
