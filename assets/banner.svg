<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="3" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Left: Mascot Icon Box -->
  <g transform="translate(80, 55)">
    <rect width="250" height="250" rx="52" fill="#0f172a" stroke="#334155" stroke-width="3" />
    
    <!-- Neon Ring -->
    <circle cx="125" cy="125" r="95" fill="none" stroke="#5865F2" stroke-width="3" opacity="0.4" stroke-dasharray="10 8" />

    <!-- Headphones -->
    <path d="M 60 120 A 70 70 0 0 1 190 120" fill="none" stroke="#5865F2" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />
    <rect x="50" y="112" width="16" height="36" rx="8" fill="#5865F2" />
    <rect x="184" y="112" width="16" height="36" rx="8" fill="#5865F2" />

    <!-- Isometric Minecraft Block -->
    <polygon points="125,75 180,105 125,135 70,105" fill="#10b981" stroke="#34d399" stroke-width="2" />
    <polygon points="70,105 125,135 125,195 70,165" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" />
    <polygon points="125,135 180,105 180,165 125,195" fill="#6366f1" stroke="#818cf8" stroke-width="2" />
    
    <!-- Server LEDs -->
    <circle cx="85" cy="140" r="3" fill="#10b981" />
    <circle cx="95" cy="146" r="3" fill="#38bdf8" />
    <circle cx="105" cy="152" r="3" fill="#10b981" />
  </g>

  <!-- Right: Title & Highlights -->
  <g transform="translate(380, 80)">
    <!-- Version Tag -->
    <g transform="translate(0, 0)">
      <rect width="115" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="57" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" text-anchor="middle">RELEASE v2.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="url(#textGrad)">ATERNOS DISCORD BOT</text>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">The Flagship Open-Source Management Suite for Aternos Minecraft Servers</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 155)">
      <!-- Pill 1: Web Dashboard -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" />
        <text x="82" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Web Dashboard</text>
      </g>
      
      <!-- Pill 2: AI Commands -->
      <g transform="translate(175, 0)">
        <rect width="160" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" />
        <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🤖 AI Assistant (/ask)</text>
      </g>

      <!-- Pill 3: Multi-Server -->
      <g transform="translate(345, 0)">
        <rect width="155" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" />
        <text x="77" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🗂️ Multi-Server</text>
      </g>

      <!-- Pill 4: Prometheus -->
      <g transform="translate(510, 0)">
        <rect width="160" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" />
        <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📈 Prometheus Ready</text>
      </g>
    </g>
  </g>
</svg>
